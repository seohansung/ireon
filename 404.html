<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    (function () {
      var path = window.location.pathname;

      // /entity/... → /en/entity/...
      if (path.startsWith("/entity/")) {
        window.location.replace("/en" + path);
        return;
      }

      // 루트나 기타 경로 → /en/
      if (!path.startsWith("/en/")) {
        window.location.replace("/en/");
        return;
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>

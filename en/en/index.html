<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ireon | Entity Index</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/search.css" />
  <style>
    body {
      margin: 0;
      background: #f7f7f4;
      color: #181818;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 44px 20px 80px;
    }

    .ireon-top-nav {
      display: flex;
      gap: 14px;
      margin-bottom: 28px;
      font-size: 14px;
    }

    .ireon-top-nav a {
      color: #263f73;
      text-decoration: none;
      font-weight: 600;
    }

    h1 {
      font-size: clamp(40px, 6vw, 72px);
      letter-spacing: -0.06em;
      line-height: 1;
      margin: 0 0 12px;
    }

    .lead {
      color: #555;
      font-size: 18px;
      margin-bottom: 28px;
    }

    .ireon-search-box {
      margin: 0 0 28px;
    }

    #search-input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      font-size: 16px;
      border: 1px solid #d8d4cb;
      border-radius: 14px;
      background: #fff;
      outline: none;
    }

    #search-results {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      padding: 0;
      list-style: none;
    }

    .card a {
      display: block;
      height: 100%;
      background: #fff;
      border: 1px solid #e5e2da;
      border-radius: 18px;
      padding: 18px;
      color: inherit;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.035);
    }

    .card strong {
      display: block;
      font-size: 20px;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
    }

    .card span {
      display: block;
      color: #263f73;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .card p {
      margin: 0;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <nav class="ireon-top-nav">
      <a href="/en/">Home</a>
      <a href="/en/about/">About</a>
      <a href="/en/privacy/">Privacy</a>
      <a href="/en/contact/">Contact</a>
    </nav>

    <h1>Ireon</h1>
    <p class="lead">0 connected entity pages generated from structured source evidence.</p>

    <section class="ireon-search-box">
      <input id="search-input" placeholder="Search Ireon..." autocomplete="off" />
      <div id="search-results"></div>
    </section>

    <ul class="grid">
      
    </ul>
  </main>

  <script src="/assets/search.js"></script>
</body>
</html>
